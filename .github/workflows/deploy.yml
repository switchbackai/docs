# Build the Starlight site and deploy it to GitHub Pages at docs.switchbak.dev.
# The Pages source of this repository is "GitHub Actions". The macOS release in
# switchback pushes the pages to main, which runs this workflow.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Builds the site; starlight-links-validator fails the build on a dead link.
      - uses: withastro/action@v6.1.4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
